# =============================================================================
# RepoPilot — edge configuration (nginx)
#
# This is the file the `web` image serves from. It is a working config, not a
# template: `deploy/nginx/` is copied into the image, this file lands at
# `/etc/nginx/conf.d/default.conf`, and `docker-compose.yml` runs that image as
# the only service that publishes a port.
#
#   Routing table
#   ─────────────────────────────────────────────────────────────────────────
#   GET  /                → /usr/share/nginx/html (apps/web/dist), SPA fallback
#   GET  /assets/*        → the same directory, immutable, hashed filenames
#   *    /api/*           → api:4000   (Fastify)
#   GET  /health          → api:4000
#   GET  /docs/*          → api:4000   (the OpenAPI document)
#   GET  /healthz         → nginx itself, never proxied
#
# The API is deliberately *not* the public root. It used to be: both the nginx
# and the Caddy examples in `docs/deployment/` proxied `/` to the API and left
# the UI commented out at an `/app/` subpath, which is not a deployment anyone
# could use — the API's `GET /` answers a JSON service index, so that shape
# serves a JSON blob to a browser. The UI is the thing a visitor asks for, so
# the UI gets `/`.
#
# Consequences, all of them intentional (D-030):
#
#   * `apps/web` is served from the origin root, so `vite.config.ts` keeps
#     `base: '/'` (its default) and the sub-path deployment question is closed
#     rather than deferred.
#   * Browser requests are same-origin, so CORS is not load-bearing here. It
#     stays configured for local development, where the UI runs on :5173 and
#     the API on :4000.
#   * The API's own `GET /` service index is shadowed by the UI and is only
#     reachable from inside the compose network. That is the point: the index
#     names internal endpoints and has no business being the public root.
# =============================================================================

upstream repopilot_api {
    # The compose service name. Docker's embedded DNS resolves it.
    server api:4000;

    # Reuse upstream connections instead of opening one per request.
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Do not advertise the nginx version in responses or error pages.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # Proxying, set once at server level and inherited by every `location` that
    # proxies. Locations that only serve files ignore these.
    # -------------------------------------------------------------------------

    proxy_http_version 1.1;

    # X-Forwarded-For is **load-bearing, not cosmetic**. The API's rate limiter
    # keys on it before falling back to the socket address
    # (`middleware/rate-limit.ts`: `keyGenerator` reads `x-forwarded-for`
    # first), and `@fastify/rate-limit@10.3.0` checks its `allowList` against
    # that same key — `index.js:233` is `params.allowList.indexOf(key)`, not a
    # check against `req.ip`. The API allows `127.0.0.1` and `::1`.
    #
    # So a proxy that forwards the request *without* this header hands the API
    # `req.ip` = the proxy's own address; when the proxy runs on the same host
    # as the API, that address is `127.0.0.1`, every request matches the
    # allowList, and rate limiting is silently switched off for the entire
    # deployment. R-24 records that. Do not remove this line.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host              $host;

    # Required for the `keepalive` directive on the upstream to take effect:
    # without it nginx sends `Connection: close` and the pool is useless.
    proxy_set_header Connection        "";

    # A full audit is asynchronous — the POST answers 202 and returns — so
    # these are generous rather than necessary. They are here for the
    # synchronous endpoints (`/health`, the derived views, the OpenAPI doc)
    # and to fail predictably instead of hanging.
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # -------------------------------------------------------------------------
    # Response headers for documents. See the snippet for why this is a file.
    # -------------------------------------------------------------------------
    include /etc/nginx/snippets/repopilot-security.conf;

    # -------------------------------------------------------------------------
    # Compression
    # -------------------------------------------------------------------------

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # -------------------------------------------------------------------------
    # Request size
    # -------------------------------------------------------------------------
    #
    # The API hard-limits JSON bodies at 64 KB (`server.ts` `bodyLimit`, plus a
    # second check in the `application/json` content-type parser). This is
    # deliberately *larger* than that: nginx rejects with a bare HTML 413 that
    # a JSON client cannot parse, so the boundary sits above the API's and the
    # API is the one that answers, in its own envelope. Matching the two
    # exactly would let nginx win the race on an exactly-64 KB body.
    client_max_body_size 128k;

    # -------------------------------------------------------------------------
    # nginx's own liveness
    # -------------------------------------------------------------------------
    #
    # Answers without touching the API on purpose. If this proxied `/health`
    # then an API outage would mark the edge unhealthy and compose would
    # restart-loop the container that is still perfectly able to serve the UI's
    # static shell — turning a partial outage into a total one.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # -------------------------------------------------------------------------
    # API
    # -------------------------------------------------------------------------

    location /api/ {
        proxy_pass http://repopilot_api;
    }

    location = /health {
        access_log off;
        proxy_pass http://repopilot_api;
    }

    location /docs/ {
        proxy_pass http://repopilot_api;
    }

    # -------------------------------------------------------------------------
    # Static UI
    # -------------------------------------------------------------------------

    # Vite writes content-hashed filenames into `assets/`, so these are safe to
    # cache forever and never need revalidating. `immutable` stops even the
    # conditional request.
    #
    # `try_files $uri =404` rather than falling through to `index.html`: a
    # missing asset must be a clean 404, not an HTML document served under a
    # `.js` content type, which surfaces in the browser as a syntax error
    # pointing at line 1 of `<!doctype html>`.
    location /assets/ {
        include /etc/nginx/snippets/repopilot-security.conf;
        access_log off;
        # `add_header` and not `expires 1y`: `expires` emits its own
        # `Cache-Control: max-age=...`, so using both would put two
        # `Cache-Control` headers on the response and leave the winner up to
        # the client. One header, stated once.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The entry document names the current asset hashes, so it must never be
    # cached: a stale `index.html` points at files the new deployment deleted.
    # `try_files`'s `/index.html` fallback lands here too, which is what gives
    # the SPA its client-side routes without caching them.
    location = /index.html {
        include /etc/nginx/snippets/repopilot-security.conf;
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # A dotfile in the web root would otherwise be served as a static file by
    # the rule above. There is no reason for one to exist; refuse rather than
    # serve it.
    location ~ /\. {
        deny all;
    }
}
