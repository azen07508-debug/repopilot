# =============================================================================
# RepoPilot — response headers for documents served by the edge.
#
# This is a separate file on purpose. nginx's `add_header` inheritance is
# all-or-nothing per block: the moment a `location` declares *any* `add_header`
# of its own, every `add_header` inherited from the enclosing `server` block is
# discarded. The UI needs a different `Cache-Control` for `index.html` than for
# the hashed bundle, so those locations must declare one — and doing that inline
# silently dropped the CSP from `index.html`, the one document that actually
# needs a CSP. `include`-ing the same file in each block keeps one definition
# and makes the discard harmless.
#
# Included from:
#   * `repopilot.conf`, at `server` level  → inherited by the proxying locations
#   * `repopilot.conf`, in `location = /index.html`
#   * `repopilot.conf`, in `location /assets/`
# =============================================================================

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# HSTS is deliberately absent here. This config terminates plain HTTP; HSTS on
# an http:// origin is ignored by browsers, so declaring it would be a lie in
# the file. It belongs in the TLS terminator, where `$scheme` is `https`.

# The UI is a static bundle: no plugins, no frames, no external origins.
#   * `style-src` needs `'unsafe-inline'` because the components use inline
#     `style={{...}}` attributes.
#   * `script-src` needs no nonce: Vite emits one same-origin module file.
#   * `connect-src 'self'` is enough because the UI talks to `/api/*` on its
#     own origin — which is the point of this topology.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'" always;
