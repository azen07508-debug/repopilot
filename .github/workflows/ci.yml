name: CI

on:
  push:
    branches: [main, master, sprint/**]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this manual run?'
        required: false
        default: 'manual nudge'

# Cancel in-flight runs of the same branch / PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimum permissions; the workflow does not need anything else.
permissions:
  contents: read

jobs:
  test:
    name: lint + typecheck + test + build (Node ${{ matrix.node }}, ${{ matrix.db }})
    # Pinned, not `ubuntu-latest`. GitHub migrates `ubuntu-latest` to
    # Ubuntu 26 on 2026-10-19, and an image change can break a build that
    # was green the day before without a line of ours changing. Pinning
    # makes that upgrade a decision instead of a surprise; bump the
    # version deliberately, after verifying it.
    #
    # The `actions/*` steps are pinned to the first major that runs on
    # Node 24. The `@v4` majors target Node 20 and were being forced onto
    # Node 24 on every run, which is what the deprecation warning was.
    #
    # Verified against each action's own `action.yml` at the tag, reading
    # `runs.using` rather than trusting the release prose:
    #
    #   checkout@v5         node24      setup-node@v5    node24
    #   cache@v5            node24      upload-artifact@v6  node24
    #
    # upload-artifact is the odd one out: its v5 still declares `node20`,
    # so v6 is the first major that actually clears the warning.
    # Newer majors exist (checkout v7, setup-node v7, cache v6,
    # upload-artifact v7); these are the minimum that resolve it, which
    # keeps the upgrade a decision rather than a surprise.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22']
        db: ['sqlite', 'postgres']
    env:
      NODE_ENV: test
      LOG_LEVEL: warn
      PAYMENT_MODE: mock
    services:
      postgres:
        # GitHub Actions has no `if` for services. `services.<id>` accepts
        # only image / env / ports / volumes / options / credentials, and
        # an unsupported key makes the entire workflow fail to parse —
        # which is what happened here: every run failed in 0s with no
        # logs, including runs from before this work started.
        #
        # So the container starts for both matrix legs. The sqlite leg
        # never connects to it (its DATABASE_URL points at an in-memory
        # file); the cost is a few seconds of container startup.
        image: postgres:16-alpine
        env:
          POSTGRES_DB: repopilot_test
          POSTGRES_USER: repopilot
          POSTGRES_PASSWORD: repopilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          # Off on purpose. From v5 this action caches automatically
          # whenever `packageManager` is set in package.json, and the
          # root sets `pnpm@11.11.0` — so the default would add a second
          # pnpm-store cache beside the explicit `actions/cache` step
          # below. One cache, keyed the way this workflow chooses.
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@11.11.0 --activate

      - name: Get pnpm store location
        id: pnpm-store
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ matrix.node }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-${{ matrix.node }}-

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Workspace packages are consumed through their `exports` field,
      # which points at ./dist. `pnpm -r typecheck` runs `tsc --noEmit`
      # in every package, so it never emits those dists — without this
      # step every cross-package import fails to resolve (TS2307) or
      # degrades to `any` and produces a wall of TS7006 noise.
      #
      # It has to run before lint, because the root lint also type-checks
      # every package. Since R-33 the root lint builds a package whose dist
      # is older than its src itself, so this step is no longer the only
      # thing standing between lint and a stale dist — but it is still what
      # makes the standalone `pnpm -r typecheck` below correct, and it is
      # still the order a reader should assume.
      - name: Build workspace packages (types for downstream packages)
        run: pnpm --filter "./packages/*" build

      # The root lint, not `pnpm -r lint`. The recursive form ran five
      # `echo skip-package-lint` stubs and checked nothing; those scripts are
      # deleted and `scripts/lint.ts` now reports any script whose body cannot
      # fail (R-26), so `pnpm -r lint` fails loudly instead of passing
      # silently — but the gate is still this one, because it is the one that
      # runs tsc across all packages plus the custom rules.
      - name: Lint (tsc + custom rules)
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r typecheck

      # Static review of docker-compose.yml, the Dockerfile and the edge nginx
      # config. It needs no Docker CLI, so it can run on every push — and it
      # should, because these three files are only correct *together*: a `web`
      # service whose nginx does not proxy `/api/` is a UI that cannot reach
      # its own backend, and the YAML still looks fine on its own. Until now
      # the only thing that ever read them was the PR-only Docker workflow.
      - name: Deploy topology (compose + edge routing)
        run: pnpm compose:check

      # The documents state facts about the code — how many MCP tools exist,
      # which compose services there are, how many workspace packages. Those
      # facts are generated into the documents between `docs-facts` markers and
      # recomputed here. A hand-written number that drifts is the defect class
      # the 2026-10-01 review found fourteen of, and this is the check that
      # makes the next one impossible rather than merely unlikely.
      #
      # It also asserts three things that carry no generated block: that the
      # `BILLING` map matches the registered tools, that `docs/INDEX.md` links
      # every document, and that every `pnpm <script>` a document names exists.
      # That last one had already caught `pnpm start:api` and
      # `pnpm start:worker` being documented before they existed.
      - name: Documentation facts (docs vs code)
        run: pnpm docs:check

      # Static review of the Dockerfile itself: the Node base image against
      # `engines.node`, agreement between the install and build filter lists,
      # and that every file which changes how `pnpm install` resolves
      # dependencies is copied before it runs. All three were live defects.
      #
      # `--static-only` because this runner has a Docker CLI: without it the
      # step would perform a second, uncached build of the image that
      # `docker.yml` already builds with a warm gha cache.
      - name: Dockerfile (static review)
        run: bash scripts/docker-check.sh --static-only

      - name: Test
        env:
          DATABASE_URL: ${{ matrix.db == 'postgres' && format('postgres://repopilot:repopilot_test@localhost:5432/repopilot_test') || 'file::memory:?cache=shared' }}
          # Some integration tests resolve a repository through the GitHub
          # API. Anonymous access is capped at 60 requests/hour per IP and
          # runner IPs are shared, so a token is required for reliability.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `tee` because the next step checks the documented totals against *this*
        # run rather than a second one — the same reason `verify:release` step
        # 4b consumes a transcript instead of running the suite again. A number
        # that is only knowable by running the suite cannot be checked by
        # running it twice.
        #
        # `set -o pipefail` is load-bearing, and it is the whole reason this is
        # not a one-liner. A pipeline's exit status is the last command's, so
        # without it `pnpm -r test | tee …` reports `tee`'s 0 and a failing
        # suite goes green — a check that cannot fail, which is R-26's shape.
        # GitHub's default shell for `run` is `bash -e`, which does not include
        # pipefail; `shell: bash` does, but it is spelled out here so the
        # dependency sits on the line that needs it.
        run: |
          set -o pipefail
          pnpm -r test | tee "$RUNNER_TEMP/test-output.txt"

      # The totals in `PROJECT_STATE.md` are the one set of numbers in the
      # repository that a generator cannot produce: they are only knowable by
      # running the suite, so a generator that emitted them would make the check
      # circular. `scripts/test-baseline.ts` consumes a run instead, and this is
      # that run.
      #
      # It runs on **both** matrix legs, each checking its own line. That is the
      # point: `verify:release` step 4b does the same check, but `verify:release`
      # only runs on the sqlite leg, so the `**postgres**` line was verified by
      # nothing at all. The leg is read from `DATABASE_URL`, the same way the
      # suite reads it, so what is checked is the line matching the database the
      # tests actually ran against — and the expression below has to stay
      # identical to the one on the `Test` step for that to be true.
      - name: Test baseline (documented totals vs this run)
        env:
          DATABASE_URL: ${{ matrix.db == 'postgres' && format('postgres://repopilot:repopilot_test@localhost:5432/repopilot_test') || 'file::memory:?cache=shared' }}
        run: pnpm test:baseline --check --from "$RUNNER_TEMP/test-output.txt"

      - name: Build
        run: pnpm build

      - name: Verify release (current env)
        if: matrix.db == 'sqlite'
        env:
          # verify:release audits a real public repository end to end. The
          # actions-provided token is enough to stay inside the rate limit;
          # without it the audit steps degrade to SKIP (see
          # scripts/verify-release.ts).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm verify:release

      - name: Upload API dist (postgres run only, for debugging)
        if: matrix.db == 'postgres' && failure()
        uses: actions/upload-artifact@v6
        with:
          name: api-dist
          path: apps/api/dist
          if-no-files-found: ignore
