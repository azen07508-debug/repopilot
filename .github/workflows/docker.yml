name: Docker

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel in-flight runs of the same ref.
concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: docker build (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: repopilot:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image (start, hit /health, stop)
        env:
          NODE_ENV: production
          PAYMENT_MODE: mock
          DATABASE_URL: file:/tmp/repopilot-smoke.db
          PORT: 4000
          HOST: 127.0.0.1
          ALLOWED_REPO_HOSTS: github.com,raw.githubusercontent.com
          LOG_LEVEL: warn
        run: |
          set -euo pipefail
          docker run --rm -d --name repopilot-smoke -p 4000:4000 \
            -e NODE_ENV -e PAYMENT_MODE -e DATABASE_URL -e PORT -e HOST \
            -e ALLOWED_REPO_HOSTS -e LOG_LEVEL \
            repopilot:test
          for i in $(seq 1 30); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:4000/health || echo 000)
            if [ "$code" = "200" ]; then
              echo "Health OK after ${i}s"
              cat /tmp/health.json
              echo
              exit 0
            fi
            sleep 1
          done
          echo "Health check never returned 200"
          docker logs repopilot-smoke || true
          exit 1
